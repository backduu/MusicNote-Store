services:
  oracle-db:
    image: gvenzl/oracle-xe:21
    container_name: oracle-db
    ports:
      - "11521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_PWD}
      - APP_USER=${ORACLE_ID}
      - APP_USER_PASSWORD=${ORACLE_PWD}
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data: